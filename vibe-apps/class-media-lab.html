<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리반 매체수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<!-- Firebase SDK (v10.12.2 compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- QRCode.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#F3F6FC; --card:#FFFFFF; --card-soft:#FAFBFE;
    --ink:#33475B; --ink-soft:#8492A6;
    --line:#E6ECF4;
    --mail:#DCEAFB; --mail-ink:#3A6EA5; --mail-dark:#2C5C90;
    --msg:#D8F5E3; --msg-ink:#2FAE6A; --msg-dark:#238C55;
    --web:#DAEBFC; --web-ink:#3E86D6; --web-dark:#2C6BB0;
    --stat:#EBE1FC; --stat-ink:#8B6FD9; --stat-dark:#7457C2;
    --primary:#FF8A73; --primary-dark:#F26B50;
    --danger:#EF6F63; --danger-dark:#D9564A;
    --gold:#F5B93F;
    --chat-bg:#FFF8DC; --chat-panel:#FFFDF3;
    --notebook:#FBF3E2; --notebook-card:#FFFCF5; --notebook-ink:#8A6A3F;
    --radius:20px;
    --shadow: 0 6px 20px rgba(51,71,91,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg);
    color:var(--ink); font-family:'Gowun Dodum', sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:20px 16px 60px;
  }
  .app{ width:100%; max-width:520px; transition:max-width .2s ease; }
  /* 와이드 모드 (컴퓨터실 모니터 지원) */
  @media(min-width: 900px){
    .app.wide-view{ max-width:760px; }
  }

  h1,h2,h3,h4{ font-family:'Gowun Dodum', sans-serif; margin:0 0 4px 0; font-weight:700; color:var(--ink); }
  h1{ font-size:25px; letter-spacing:-0.2px; }
  h2{ font-size:19px; } h3{ font-size:16px; } h4{ font-size:14.5px; }
  p{ margin:0; line-height:1.55; }
  .muted{ color:var(--ink-soft); font-size:13.5px; }
  .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .badge-mark{
    width:46px; height:46px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    color:var(--primary-dark); background:#FFE7E1;
    font-size:13px; flex-shrink:0; text-align:center; line-height:1.1; font-weight:bold;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow);
    position:relative;
  }
  label{ display:block; font-size:13px; color:var(--ink-soft); margin:14px 0 6px; font-weight:600; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=password], textarea, select{
    width:100%; border:1.5px solid var(--line); background:var(--card-soft); border-radius:14px;
    padding:11px 14px; font-family:'Gowun Dodum', sans-serif; font-size:15px; color:var(--ink); outline:none;
    transition:border-color .15s;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--primary); background:#fff; }
  textarea{ resize:vertical; min-height:110px; line-height:1.6; }
  .pin-input{ letter-spacing:8px; font-size:20px; text-align:center; font-family:monospace; }
  .code-input{ letter-spacing:3px; font-size:18px; text-align:center; text-transform:uppercase; font-weight:bold; }
  .autocomplete{ position:relative; }
  .suggestions{
    position:absolute; z-index:20; left:0; right:0; top:calc(100% + 4px);
    background:#fff; border:1.5px solid var(--line); border-radius:14px;
    max-height:180px; overflow-y:auto; box-shadow:0 8px 20px rgba(51,71,91,0.12);
  }
  .suggestions div{ padding:10px 14px; cursor:pointer; font-size:14.5px; border-bottom:1px solid var(--line); }
  .suggestions div:last-child{ border-bottom:none; }
  .suggestions div:hover{ background:#FFF1EC; color:var(--primary-dark); font-weight:bold; }

  button{
    font-family:'Gowun Dodum', sans-serif; font-size:15px; border:none; border-radius:16px;
    padding:12px 16px; cursor:pointer; width:100%; margin-top:14px; transition:background .15s, transform .05s;
  }
  button:active{ transform:scale(0.99); }
  .btn-primary{ background:var(--primary); color:#fff; font-weight:600; }
  .btn-primary:hover{ background:var(--primary-dark); }
  .btn-chat{ background:var(--msg-ink); color:#fff; font-weight:600; }
  .btn-chat:hover{ background:var(--msg-dark); }
  .btn-web{ background:var(--web-ink); color:#fff; font-weight:600; }
  .btn-web:hover{ background:var(--web-dark); }
  .btn-secondary{ background:#EEF2F8; color:var(--ink); border:none; }
  .btn-secondary:hover{ background:var(--line); }
  .btn-sage{ background:var(--msg-dark); color:#fff; font-weight:600; }
  .btn-sage:hover{ background:#1F7A49; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); width:auto; margin-top:0; padding:8px 10px; font-size:13.5px; text-decoration:underline; }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; width:auto; margin-top:0; border-radius:10px; }
  .btn-outline-danger{ background:transparent; border:1.5px solid var(--danger); color:var(--danger); }
  .btn-outline-danger:hover{ background:var(--danger); color:#fff; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row button{ margin-top:14px; }
  .error{ color:var(--danger-dark); font-size:13.5px; margin-top:8px; font-weight:600; }
  .success{ color:var(--msg-dark); font-size:13.5px; margin-top:8px; font-weight:600; }

  /* 헤더 툴바 */
  .top-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }
  .top-toolbar-left, .top-toolbar-right{ display:flex; align-items:center; gap:8px; }
  .tool-chip{
    display:inline-flex; align-items:center; gap:5px; padding:6px 12px; font-size:12.5px;
    background:#EEF2F8; border:none; border-radius:20px;
    color:var(--ink); text-decoration:none; cursor:pointer; font-family:'Gowun Dodum', sans-serif;
  }
  .tool-chip:hover{ background:var(--line); }
  .tool-chip.active{ background:var(--ink); color:#fff; }
  .tool-chip.edu{ background:#FFF3D6; color:#A87400; font-weight:bold; }
  .tool-chip.share{ background:var(--web); color:var(--web-dark); font-weight:bold; }

  /* 통계 그리드 */
  .stat-grid{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .stat-box{ flex:1; min-width:68px; text-align:center; border-radius:14px; padding:12px 4px; background:var(--stat); }
  .stat-box .num{ font-size:21px; color:var(--stat-dark); font-weight:bold; }
  .stat-box .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  /* 내비게이션 바 */
  .nav{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .nav button{ width:auto; margin-top:0; padding:9px 14px; font-size:13px; background:#EEF2F8; color:var(--ink); border:none; border-radius:14px; }
  .nav button.active{ background:var(--primary); color:#fff; font-weight:bold; }

  /* 테이블 */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th{ color:var(--ink-soft); font-weight:600; background:transparent; }
  .badge{ display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; background:#EEF2F8; color:var(--ink-soft); }
  .badge.open{ background:#DFF5E7; color:var(--msg-dark); font-weight:bold; }
  .badge.round{ background:var(--stat); color:var(--stat-dark); font-weight:bold; }
  .badge.locked{ background:#FDE4E1; color:var(--danger-dark); font-weight:bold; }
  .link-btn{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; width:auto; padding:0; margin:0; font-size:12.5px; cursor:pointer; }
  .empty{ text-align:center; padding:28px 10px; color:var(--ink-soft); font-size:14px; }
  hr.dashed{ border:none; border-top:1px solid var(--line); margin:14px 0; }
  .letter-view{ background:var(--card-soft); border-radius:14px; padding:16px; white-space:pre-wrap; line-height:1.7; font-size:15px; margin-top:10px; }
  textarea::placeholder, input::placeholder{ color:#AFBBCB; }

  /* 메인 화면 (제공해주신 컨셉 이미지를 실제 배경으로 사용) */
  .hub-image-wrap{
    position:relative; width:100%; border-radius:var(--radius); overflow:hidden;
    margin-bottom:14px; box-shadow:var(--shadow); line-height:0;
  }
  .hub-bg-img{ display:block; width:100%; height:auto; }
  .hub-cloud-title{
    position:absolute; left:26%; top:6%; width:44%; height:22%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-weight:700; color:#2E5B4C; font-size:clamp(13px, 3.6vw, 19px);
    padding:0 4%; pointer-events:none;
  }
  .hub-hotspot{
    position:absolute; cursor:pointer; display:flex; align-items:center;
    border-radius:14px; transition:background .15s;
  }
  .hub-hotspot:hover, .hub-hotspot:active{ background:rgba(255,255,255,0.25); }
  .hub-hotspot-title{
    font-weight:700; font-size:clamp(11px, 2.9vw, 15.5px); line-height:1.25;
    padding-left:40%; width:100%;
  }
  .hub-hotspot-desc{
    display:block; font-weight:400; font-size:clamp(9px, 2.1vw, 11.5px); margin-top:2px; opacity:0.85;
  }

  /* 전자우편 편지함 목록 */
  .envelope-card{
    background:var(--card); border:none;
    border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; position:relative; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .15s;
  }
  .envelope-card:active{ transform:scale(0.98); }
  .envelope-flap{ display:none; }
  .envelope-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }

  /* 휴대전화 메시지 */
  .chat-box-wrap{
    display:flex; flex-direction:column; height:380px; border:none;
    border-radius:var(--radius); background:var(--chat-panel); overflow:hidden; box-shadow:var(--shadow);
  }
  .chat-thread{
    flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:9px;
    background:var(--chat-bg);
  }
  .bubble-row{ display:flex; align-items:flex-end; gap:6px; }
  .bubble-row.me{ justify-content:flex-end; }
  .avatar-circle{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; font-weight:bold;
  }
  .bubble-col{ display:flex; flex-direction:column; max-width:78%; }
  .bubble-name{ font-size:11px; color:var(--ink-soft); margin:0 0 3px 2px; }
  .bubble{
    padding:10px 14px; border-radius:18px; font-size:14.5px; line-height:1.5;
    border:1.5px solid transparent; background:#fff; word-break:break-word;
  }
  .bubble-row.me .bubble{ border-color:var(--primary); border-bottom-right-radius:4px; }
  .bubble-row.you .bubble{ border-color:var(--web-ink); border-bottom-left-radius:4px; }
  .bubble .meta{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right; }
  .chat-compose{ display:flex; gap:8px; align-items:flex-end; padding:10px; background:#fff; border-top:1px solid var(--line); }
  .chat-compose textarea{ min-height:44px; height:44px; padding:10px 12px; }
  .chat-compose button{ width:auto; margin-top:0; padding:10px 18px; height:44px; flex-shrink:0; white-space:nowrap; display:flex; align-items:center; justify-content:center; }
  .thread-list-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:none; border-radius:16px; padding:12px 14px; margin-bottom:10px;
    background:var(--card); cursor:pointer; transition:background .15s; box-shadow:var(--shadow);
  }
  .thread-list-item:hover{ background:#F7FAFF; }

  /* 학급 누리집 */
  .post-card{ border:none; border-radius:var(--radius); padding:16px; margin-bottom:14px; background:var(--notebook-card); box-shadow:var(--shadow); }
  .post-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .post-author{ font-weight:700; color:var(--web-dark); font-size:15px; }
  .post-time{ font-size:11.5px; color:var(--ink-soft); }
  .post-content{ font-size:14.5px; line-height:1.6; white-space:pre-wrap; margin-bottom:10px; word-break:break-word; }
  .post-actions{ display:flex; gap:12px; align-items:center; }
  .like-btn{ width:auto; margin-top:0; padding:6px 12px; font-size:13px; background:#F3F6FC; border:none; color:var(--ink); border-radius:20px; }
  .like-btn.liked{ background:#FDE4E1; color:var(--danger-dark); font-weight:bold; }
  .comment-toggle{ width:auto; margin-top:0; padding:6px 10px; font-size:13px; background:none; border:none; color:var(--ink-soft); text-decoration:underline; }
  .comment-box{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .comment-node{ padding:9px 0; border-bottom:1px solid var(--line); }
  .comment-head{ display:flex; align-items:flex-start; gap:8px; }
  .comment-bubble{ flex:1; min-width:0; background:var(--notebook); border-radius:14px; padding:8px 12px; }
  .comment-author-line{ font-size:12.5px; margin-bottom:2px; }
  .comment-author-line b{ color:var(--web-dark); }
  .reply-arrow{ color:var(--ink-soft); }
  .comment-text{ font-size:13.5px; line-height:1.5; word-break:break-word; }
  .comment-actions{ display:flex; gap:4px; align-items:center; margin:4px 0 0 36px; }
  .comment-like-btn{
    width:auto; margin:0; padding:2px 9px; font-size:12px; border-radius:14px;
    background:#F3F6FC; border:none; color:var(--ink-soft);
  }
  .comment-like-btn.liked{ background:#FDE4E1; color:var(--danger-dark); font-weight:bold; }
  .comment-reply-btn{ width:auto; margin:0; padding:2px 8px; font-size:12px; background:none; border:none; color:var(--ink-soft); text-decoration:underline; }
  .comment-compose{ display:flex; gap:6px; margin-top:10px; }
  .comment-compose input{ flex:1; }
  .comment-compose button{ width:auto; margin-top:0; padding:9px 14px; font-size:13px; flex-shrink:0; white-space:nowrap; }

  /* 전자우편 쓰기 화면 */
  .mail-client{ background:#fff; border:none; border-radius:var(--radius); overflow:hidden; margin-bottom:14px; box-shadow:var(--shadow); }
  .mail-tabtop{ display:flex; justify-content:space-between; align-items:center; background:var(--mail); padding:12px 16px; font-size:13.5px; font-weight:bold; color:var(--mail-dark); }
  .mail-tabtop-x{ color:var(--mail-dark); opacity:0.6; cursor:default; }
  .mail-action-row{ display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .mail-btn{ width:auto; margin:0; padding:8px 14px; font-size:12.5px; border-radius:12px; }
  .mail-btn-send{ background:var(--mail-ink); color:#fff; font-weight:bold; }
  .mail-btn-send:hover{ background:var(--mail-dark); }
  .mail-btn-mock{ background:#F3F6FC; color:var(--ink-soft); border:none; }
  .mail-btn-mock:hover{ background:var(--line); }
  .mail-fields{ padding:4px 16px; }
  .mail-field-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .mail-field-row:last-child{ border-bottom:none; }
  .mail-field-label{ width:76px; flex-shrink:0; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .mail-field-row input, .mail-field-row .autocomplete{ flex:1; }
  .mail-field-row input{ border:none; padding:4px 2px; background:transparent; border-radius:0; }
  .mail-field-row input:disabled{ color:var(--ink); -webkit-text-fill-color:var(--ink); opacity:1; }
  .mail-rte-toolbar{ display:flex; gap:5px; padding:9px 16px; background:var(--card-soft); border-top:1px solid var(--line); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .mail-rte-btn{ width:auto; margin:0; padding:6px 10px; font-size:12px; background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:8px; }
  .mail-body{ border:none; border-radius:0; min-height:160px; padding:16px; background:#fff; }
  .mail-body:focus{ background:#fff; }
  .mail-attach{ border-top:1px solid var(--line); padding:12px 16px 16px; }
  .mail-attach-head{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:bold; color:var(--ink-soft); margin-bottom:6px; }
  .mail-attach-item{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--line); color:var(--ink); }
  .mail-attach-actions button{ font-size:13px; }

  /* 모달 오버레이 */
  .modal-overlay{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
    background:rgba(51,71,91,0.45); backdrop-filter:blur(3px);
    display:flex; justify-content:center; align-items:center; padding:16px;
  }
  .modal{
    background:#fff; border-radius:24px; border:none;
    box-shadow:0 16px 40px rgba(51,71,91,0.22); width:100%; max-width:540px;
    max-height:90vh; overflow-y:auto; padding:24px; position:relative;
  }
  .modal-x{
    position:absolute; top:16px; right:16px; background:none; border:none;
    font-size:20px; color:var(--ink-soft); cursor:pointer; width:auto; margin:0; padding:4px 8px;
  }
  .modal h2{ font-size:20px; margin-bottom:8px; color:var(--ink); }
  .step-box{ display:flex; gap:12px; margin:12px 0; align-items:flex-start; }
  .step-num{
    width:24px; height:24px; border-radius:50%; background:var(--primary);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:bold; flex-shrink:0; margin-top:2px;
  }
  .step-tx{ font-size:13.5px; line-height:1.55; color:var(--ink); }
  .tip-box{
    background:#FFF6E0; border:none; border-radius:14px;
    padding:12px 14px; font-size:13px; color:#8A6100; margin:12px 0; line-height:1.5;
  }

  /* 토스트 */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 20px; border-radius:30px;
    font-size:14px; z-index:200; box-shadow:0 6px 18px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  /* 아코디언 */
  .accordion-head{
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; padding:10px 0; user-select:none;
  }
  .accordion-content{ display:block; }
  .accordion-content.collapsed{ display:none; }

  .qr-center{ display:flex; flex-direction:column; align-items:center; justify-content:center; margin:16px 0; }
  .qr-box{ background:#fff; padding:14px; border-radius:16px; border:none; box-shadow:var(--shadow); }
</style>
</head>
<body>
<div class="app" id="app"></div>

<!-- 토스트 알림 엘리먼트 -->
<div class="toast" id="toast"></div>

<!-- 모달 마운트 컨테이너 -->
<div id="modalMount"></div>

<script>
// =====================================================================
// 1) FIREBASE 설정 (이 우리반 매체수업 전용 프로젝트에 고정 연결됨)
// =====================================================================
let embeddedConfig = {
  apiKey: "AIzaSyBuln5OhkDppv3RXD3rcyUXLmI08Y1avrU",
  authDomain: "media-68dbb.firebaseapp.com",
  projectId: "media-68dbb",
  storageBucket: "media-68dbb.firebasestorage.app",
  messagingSenderId: "246934905390",
  appId: "1:246934905390:web:0466d6fb6dd8c5629575bf"
};

// 📌 [선생님 전용] 기본 학급 코드 사전 지정 (선택 사항)
//   선생님이 여기에 "0501"처럼 따옴표 안에 적어두시면 학생들이 코드를 입력할 필요 없이 바로 입장할 수 있어요!
let embeddedClassCode = "";

// 관리자 모드 여부: 주소 끝에 ?teacher=1 이 붙어 있을 때만 선생님 화면으로 들어감
const isTeacherMode = new URLSearchParams(location.search).get('teacher') === '1';

// 공유 링크(#s=payload) 해석 — 학급 코드를 자동으로 채워줌
function parseSharedPayload() {
  const m = location.hash.match(/[#&]s=([^&]+)/);
  if (!m) return null;
  try {
    const jsonStr = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
    const data = JSON.parse(jsonStr);
    if (data.classCode) {
      localStorage.setItem('mediaLabDefaultClassCode', data.classCode);
      localStorage.setItem('mediaLabLastClassCode', data.classCode);
    }
    return data;
  } catch (e) {
    console.warn('공유 링크 해석 실패:', e);
    return null;
  }
}

function showToast(msg) {

  if(!t) return;

  clearTimeout(t._timer);

function normalize(s){ return (s||'').trim(); }
function findRosterName(input){
  const t = normalize(input).toLowerCase();

}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function generateDerangement(names){
  if(names.length<2) return {};
  let perm, tries=0;
  do{
    perm = shuffleArr(names.slice());
    tries++;
  } while(perm.some((v,i)=>v===names[i]) && tries<300);
  perm.forEach((v,i)=>{ if(v===names[i]){ const j=(i+1)%perm.length; [perm[i],perm[j]]=[perm[j],perm[i]]; } });
  const pairs={};
  names.forEach((n,i)=> pairs[n]=perm[i]);
  return pairs;
}

function mailSent(name){ return mailsAll.filter(l=>l.from===name).length; }
function mailReceived(name){ return mailsAll.filter(l=>l.to===name).length; }

function msgReceived(name){ return messagesAll.filter(l=>l.to===name).length; }
function postCount(name){ return postsAll.filter(p=>p.author===name).length; }

function threadPartners(name){
  const set = new Set();
  messagesAll.forEach(m=>{
    if(m.from===name) set.add(m.to);
    if(m.to===name) set.add(m.from);
  });
  return [...set];
}
function threadMessages(a,b){
  return messagesAll.filter(m=> (m.from===a&&m.to===b)||(m.from===b&&m.to===a)).sort((x,y)=>x.ts-y.ts);
}
function lastMessageTs(a,b){
  const ms = threadMessages(a,b);
  return ms.length? ms[ms.length-1].ts : 0;
}
function timeStr(ts){ return new Date(ts).toLocaleString('ko-KR'); }
function dateStr(ts){ return new Date(ts).toLocaleDateString('ko-KR'); }

function clearSubscriptions(){
  Object.keys(unsub).forEach(k=>{ if(unsub[k]) { unsub[k](); unsub[k]=null; } });
}

function subscribeClass(code){
  if(!db) return;
  clearSubscriptions();
  classCode = code;
  localStorage.setItem('mediaLabLastClassCode', code);
  classDocRef = db.collection('classes').doc(code);

  unsub.class = classDocRef.onSnapshot(doc=>{
    classExists = doc.exists;
    if(doc.exists){
      classData = Object.assign({roster:[],teacherPin:null,letterOpenPolicy:'self'}, doc.data());
    } else {
      classData = {roster:[],teacherPin:null,letterOpenPolicy:'self'};
    }
    render();
  });
  unsub.mails = classDocRef.collection('mails').onSnapshot(snap=>{
    mailsAll = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  unsub.messages = classDocRef.collection('messages').onSnapshot(snap=>{
    messagesAll = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderChatThreadIfActive();
    render();
  });
  unsub.posts = classDocRef.collection('posts').onSnapshot(snap=>{
    postsAll = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>b.ts-a.ts);
    render();
  });
  unsub.roundMail = classDocRef.collection('rounds').doc('mail').onSnapshot(doc=>{
    roundMail = doc.exists ? doc.data() : {active:false, pairs:{}, roundNumber:0, completed:[]};
    render();
  });
  unsub.roundMessage = classDocRef.collection('rounds').doc('message').onSnapshot(doc=>{
    roundMessage = doc.exists ? doc.data() : {active:false, pairs:{}, roundNumber:0, completed:[]};
    render();
  });
}

function subscribeComments(postId){
  if(unsub.comments) unsub.comments();
  if(!postId){ commentsForOpenPost = []; return; }
  unsub.comments = classDocRef.collection('comments').where('postId','==',postId).onSnapshot(snap=>{
    commentsForOpenPost = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.ts-b.ts);
    render();
  });
}

function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  if(opts.class) e.className = opts.class;
  if(opts.text!==undefined) e.textContent = opts.text;
  if(opts.html!==undefined) e.innerHTML = opts.html;
  if(opts.attrs) Object.entries(opts.attrs).forEach(([k,v])=>e.setAttribute(k,v));
  if(opts.on) Object.entries(opts.on).forEach(([ev,fn])=>e.addEventListener(ev,fn));
  (children||[]).forEach(c=> c && e.appendChild(c));
  return e;
}

function autocompleteInput(placeholder, pool, onPick, prefill){
  const wrap = el('div',{class:'autocomplete'});
  const input = el('input',{attrs:{type:'text', placeholder, autocomplete:'off'}});
  if(prefill) input.value = prefill;
  const sugg = el('div',{class:'suggestions'}); sugg.style.display='none';
  wrap.appendChild(input); wrap.appendChild(sugg);
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    sugg.innerHTML='';
    if(!q){ sugg.style.display='none'; return; }
    const matches = pool.filter(n=>n.toLowerCase().includes(q)).slice(0,6);
    if(matches.length===0){ sugg.style.display='none'; return; }
    matches.forEach(n=> sugg.appendChild(el('div',{text:n, on:{click:()=>{
      input.value=n; sugg.style.display='none'; onPick && onPick(n);
    }}})));
    sugg.style.display='block';
  });
  document.addEventListener('click', (e)=>{ if(!wrap.contains(e.target)) sugg.style.display='none'; });
  return { wrap, input };
}

function openShareModal() {
  const mount = document.getElementById('modalMount');
  mount.innerHTML = '';

  // 페이로드 인코딩 (학급 코드만 담음)

function render(){
  const app = document.getElementById('app');
  app.className = 'app' + (state.wideView ? ' wide-view' : '');
  app.innerHTML = '';

  if(!firebaseInitialized) {
    renderConfigError(app);
    return;
  }

  const screens = {
    'config-error': renderConfigError,
    join: renderJoin,
    'teacher-entry': renderTeacherEntry,
    'class-setup': renderClassSetup,
    'student-login': renderStudentLogin,
    'student-hub': renderStudentHub,
    'mail-home': renderMailHome,
    'mail-compose': renderMailCompose,
    'mail-inbox': renderMailInbox,
    'mail-outbox': renderMailOutbox,
    'mail-view': renderMailView,
    'msg-home': renderMsgHome,
    'msg-thread': renderMsgThread,
    feed: renderFeed,
    'teacher-login': renderTeacherLogin,
    teacher: renderTeacher
  };
  (screens[state.screen] || (isTeacherMode ? renderTeacherEntry : renderJoin))(app);
  syncHistory();
}

// =====================================================================
// 8-B) 브라우저 뒤로가기 처리
//   화면(state.screen)이 바뀔 때마다 기록을 하나씩 쌓아서, 뒤로가기를 누르면
//   앱 밖으로 나가는 대신 이전 화면으로 돌아오게 한다. 더 쌓인 기록이 없는
//   상태(맨 처음 화면)에서 뒤로가기를 누르면 정말 나갈지 확인 팝업을 띄운다.
// =====================================================================
let lastHistoryScreen = null;
function syncHistory(){
  const snapshot = JSON.stringify(state);
  if(state.screen !== lastHistoryScreen){
    history.pushState({ appState: snapshot }, '', location.href);
    lastHistoryScreen = state.screen;
  } else {
    history.replaceState({ appState: snapshot }, '', location.href);
  }
}
window.addEventListener('popstate', (e)=>{
  if(e.state && e.state.appState){
    try{
      Object.assign(state, JSON.parse(e.state.appState));
      lastHistoryScreen = state.screen;
      render();
      return;
    }catch(err){ /* 복원 실패 시 아래 나가기 확인으로 진행 */ }
  }
  // 앱 안에 더 돌아갈 화면이 없음 — 정말 페이지를 나갈 것인지 확인
  const leave = confirm('지금 화면을 나가시겠어요? 작성 중이던 내용이 사라질 수 있어요.');
  if(!leave){
    history.pushState({ appState: JSON.stringify(state) }, '', location.href);
  }
});

// Firestore 통신 타임아웃 헬퍼 (무한 로딩 방지)
async function fetchClassWithTimeout(code, timeoutMs = 15000){
  const timeoutPromise = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('TIMEOUT')), timeoutMs)
  );
  return await Promise.race([
    db.collection('classes').doc(code).get(),
    timeoutPromise
  ]);
}

// ---------------------------------------------------------------------
function renderClassSetup(app){
  app.appendChild(header('새 학급 만들기', '선생님 전용 개설 화면'));
  const card = el('div',{class:'card'});

  card.appendChild(el('label',{text:'사용할 학급 코드 (영문·숫자·한글 자유 입력)'}));
  const codeInp = el('input',{class:'code-input', attrs:{type:'text', placeholder:'예: 0501 또는 6-1', value: classCode || '0501'}});
  card.appendChild(codeInp);
  card.appendChild(el('p',{class:'muted', text:'학생들이 접속할 때 입력하게 되는 쉬운 코드를 정해주세요.'}));

  card.appendChild(el('label',{text:'학급 명단 (줄바꿈 또는 쉼표 구분)'}));
  const roster = el('textarea',{attrs:{placeholder:'예)\n김하늘\n이도윤\n박서연\n정우진'}});
  card.appendChild(roster);

  card.appendChild(el('label',{text:'명단 파일 업로드 (.txt / .csv, 선택)'}));
  const fileInput = el('input',{attrs:{type:'file', accept:'.txt,.csv'}});
  fileInput.addEventListener('change', (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload=()=>{ roster.value = r.result; };
    r.readAsText(f,'utf-8');
  });
  card.appendChild(fileInput);

  card.appendChild(el('label',{text:'선생님 관리자 비밀번호 (숫자 4자리)'}));
  const pin = el('input',{class:'pin-input', attrs:{type:'password', inputmode:'numeric', maxlength:'4', placeholder:'••••'}});
  card.appendChild(pin);

  const err = el('p',{class:'error'});
  card.appendChild(err);

  card.appendChild(el('button',{class:'btn-primary', text:'학급 만들고 수업 시작하기 🚀', on:{click: async ()=>{
    const targetCode = normalize(codeInp.value);
    if(!targetCode){ err.textContent='학급 코드를 입력해 주세요.'; return; }
    const names = [...new Set(roster.value.split(/[\n,]/).map(s=>s.trim()).filter(Boolean))];
    if(names.length<2){ err.textContent='학생을 2명 이상 입력해 주세요.'; return; }
    if(!/^\d{4}$/.test(pin.value)){ err.textContent='선생님 비밀번호는 숫자 4자리로 입력해 주세요.'; return; }
    err.textContent = '학급 생성 중...';
    try{
      await createClass(targetCode, names, pin.value);
      classCode = targetCode;
      localStorage.setItem('mediaLabDefaultClassCode', targetCode);
      subscribeClass(targetCode);
      showToast('"'+targetCode+'" 학급이 개설되었어요!');
      state.teacherIn = true;
      state.teacherTab = 'roster';
      state.screen = 'teacher';
      render();
    }catch(e){
      console.error(e);
      err.textContent='저장 실패: ' + e.message;
    }
  }}}));
  app.appendChild(card);
  app.appendChild(el('button',{class:'btn-ghost', text:'← 관리자 접속 화면으로', on:{click:()=>{ state.screen='teacher-entry'; render(); }}}));
}

function renderMsgThread(app){
  const name = state.currentUser;
  const partner = state.chatPartner;
  state.module = 'message';
  app.appendChild(header(partner+' 님과의 대화', '휴대전화 메시지', '메시지'));
  app.appendChild(backBtn('메시지 목록', 'msg-home'));

  const wrap = el('div',{class:'chat-box-wrap'});
  const thread = el('div',{class:'chat-thread', attrs:{id:'chatThreadArea'}});

  const msgs = threadMessages(name, partner);
  if(msgs.length===0){
    thread.appendChild(el('p',{class:'empty', text:'아직 대화가 없어요. 먼저 인사를 건네보세요! 😊'}));
  }
  msgs.forEach(m=> thread.appendChild(chatBubbleRow(m, name)));
  wrap.appendChild(thread);

  const composeRow = el('div',{class:'chat-compose'});
  const input = el('textarea',{attrs:{placeholder:'메시지를 입력하세요...', rows:'1', id:'chatTextarea'}});
  input.value = drafts.chatInput;
  input.addEventListener('input', ()=> drafts.chatInput = input.value);
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendChatAction();
    }
  });

  const sendBtn = el('button',{class:'btn-chat', text:'전송', on:{click: sendChatAction}});
  composeRow.appendChild(input);
  composeRow.appendChild(sendBtn);
  wrap.appendChild(composeRow);

  app.appendChild(wrap);

  async function sendChatAction(){
    const text = normalize(input.value);
    if(!text) return;
    input.value = '';
    drafts.chatInput = '';
    try{
      await sendMessage(name, partner, text, state.chatIsRandom);
    }catch(e){
      console.error(e);
      showToast('전송 실패. 다시 시도해 주세요.');
    }
  }

  // 하단 스크롤 자동 이동
  setTimeout(()=>{
    thread.scrollTop = thread.scrollHeight;
  }, 40);
}

// 아바타 & 말풍선 렌더링 헬퍼 (이름 첫 글자로 만든 원형 아바타 — 교과서 화면 재현용)
function avatarColor(name){
  const colors = ['#C89666','#6E8F71','#4C6B9A','#A63D40','#8A6FB0','#3E7C6B','#B38728'];
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return colors[h % colors.length];
}
function avatarEl(name){
  return el('div',{class:'avatar-circle', text:(name||'?').charAt(0), attrs:{style:'background:'+avatarColor(name||'')+';'}});
}
function chatBubbleRow(m, name){
  const mine = m.from===name;
  const timeText = new Date(m.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  return el('div',{class:'bubble-row '+(mine?'me':'you')},[
    !mine ? avatarEl(m.from) : null,
    el('div',{class:'bubble-col'},[
      !mine ? el('div',{class:'bubble-name', text:m.from}) : null,
      el('div',{class:'bubble'},[
        el('div',{text:m.text}),
        el('div',{class:'meta', text:timeText})
      ])
    ]),
    mine ? avatarEl(m.from) : null
  ]);
}

  msgs.forEach(m=> thread.appendChild(chatBubbleRow(m, name)));

function renderFeed(app){
  const name = state.currentUser;
  state.module = 'feed';
  app.appendChild(header('학급 누리집', '모두가 함께 나누는 열린 게시판', '누리집'));
  app.appendChild(backBtn('매체수업 허브', 'student-hub'));

  const composeCard = el('div',{class:'card'});
  composeCard.appendChild(el('label',{text:'새 글 작성하기'}));
  const ta = el('textarea',{attrs:{placeholder:'학급 친구들과 나누고 싶은 생각, 재미있는 이야기를 작성해 보세요.'}});
  ta.value = drafts.feedPost;
  ta.addEventListener('input', ()=> drafts.feedPost = ta.value);
  composeCard.appendChild(ta);

  const err = el('p',{class:'error'});
  composeCard.appendChild(err);
  composeCard.appendChild(el('button',{class:'btn-web', text:'게시하기 ✨', on:{click: async ()=>{
    if(!normalize(ta.value)){ err.textContent='내용을 입력해 주세요.'; return; }
    try{
      await createPost(name, ta.value);
      ta.value='';
      drafts.feedPost='';
      err.textContent='';
      showToast('새 글이 등록되었어요!');
    }catch(e){ console.error(e); err.textContent='게시에 실패했습니다.'; }
  }}}));
  app.appendChild(composeCard);

  if(postsAll.length===0){
    app.appendChild(el('div',{class:'empty', text:'아직 등록된 글이 없어요. 우리 반 첫 글을 남겨보세요!'}));
    return;
  }

  postsAll.forEach(p=>{
    const liked = (p.likes||[]).includes(name);
    const isAuthor = p.author === name;
    const pc = el('div',{class:'post-card'});

    const head = el('div',{class:'post-head'});
    head.appendChild(el('div',{style:'display:flex; align-items:center; gap:8px;'},[
      avatarEl(p.author),
      el('span',{class:'post-author', text:p.author})
    ]));

    const headRight = el('div',{style:'display:flex; align-items:center; gap:8px;'});
    headRight.appendChild(el('span',{class:'post-time', text:timeStr(p.ts)}));
    if(isAuthor){
      headRight.appendChild(el('button',{class:'link-btn', text:'삭제', attrs:{style:'color:var(--danger);'}, on:{click: async ()=>{
        if(confirm('이 게시글을 삭제할까요?')) {
          await deletePost(p.id);
          showToast('게시글이 삭제되었어요');
        }
      }}}));
    }
    head.appendChild(headRight);
    pc.appendChild(head);

    pc.appendChild(el('div',{class:'post-content', text:p.content}));

    const actions = el('div',{class:'post-actions'});
    actions.appendChild(el('button',{class:'like-btn'+(liked?' liked':''), text:'❤ '+(p.likes||[]).length, on:{click: async ()=>{
      try{ await toggleLike(p.id, name); }catch(e){}
    }}}));

    const isOpen = state.openPostId===p.id;
    actions.appendChild(el('button',{class:'comment-toggle', text: isOpen? '댓글 접기' : '💬 댓글 쓰기/보기', on:{click:()=>{
      state.openPostId = isOpen ? null : p.id;
      subscribeComments(state.openPostId);
      render();
    }}}));
    pc.appendChild(actions);

    if(isOpen){
      const box = el('div',{class:'comment-box'});
      const all = commentsForOpenPost.filter(c=>c.postId===p.id);
      const topLevel = all.filter(c=>!c.parentId);
      if(all.length===0){ box.appendChild(el('p',{class:'muted', text:'아직 댓글이 없어요. 첫 댓글을 남겨보세요!'})); }

      function renderCommentNode(c, depth){
        const isCommAuthor = c.author === name;
        const liked = (c.likes||[]).includes(name);
        const node = el('div',{class:'comment-node', attrs: depth>0 ? {style:'margin-left:'+(depth*22)+'px;'} : {}});

        node.appendChild(el('div',{class:'comment-head'},[
          avatarEl(c.author),
          el('div',{class:'comment-bubble'},[
            el('div',{class:'comment-author-line'},[
              depth>0 ? el('span',{class:'reply-arrow', text:'↳ '}) : null,
              el('b',{text:c.author})
            ]),
            el('div',{class:'comment-text', text:c.content})
          ])
        ]));

        const actions = el('div',{class:'comment-actions'});
        actions.appendChild(el('button',{class:'comment-like-btn'+(liked?' liked':''), text:'♥ '+(c.likes||[]).length, on:{click: async ()=>{
          try{ await toggleCommentLike(c.id, name); }catch(e){}
        }}}));
        actions.appendChild(el('button',{class:'comment-reply-btn', text:'답글', on:{click:()=>{
          state.replyToCommentId = state.replyToCommentId===c.id ? null : c.id;
          render();
        }}}));
        if(isCommAuthor){
          actions.appendChild(el('button',{class:'comment-reply-btn', attrs:{style:'color:var(--danger);'}, text:'삭제', on:{click: async ()=>{
            if(confirm('이 댓글을 삭제할까요?')) await deleteComment(c.id);
          }}}));
        }
        node.appendChild(actions);

        if(state.replyToCommentId===c.id){
          const replyForm = el('div',{class:'comment-compose', attrs:{style:'margin-top:8px;'}});
          const replyInput = el('input',{attrs:{type:'text', placeholder:c.author+' 님에게 답글 남기기'}});
          replyForm.appendChild(replyInput);
          replyForm.appendChild(el('button',{class:'btn-secondary', text:'등록', on:{click: async ()=>{
            if(!normalize(replyInput.value)) return;
            try{
              await addComment(p.id, name, replyInput.value, c.id);
              state.replyToCommentId = null;
              render();
            }catch(e){}
          }}}));
          node.appendChild(replyForm);
        }

        all.filter(x=>x.parentId===c.id).forEach(ch=> node.appendChild(renderCommentNode(ch, depth+1)));
        return node;
      }

      topLevel.forEach(c=> box.appendChild(renderCommentNode(c, 0)));

      const cForm = el('div',{class:'comment-compose'});
      const cInput = el('input',{attrs:{type:'text', placeholder:'따뜻한 선플을 남겨보세요'}});
      cForm.appendChild(cInput);
      cForm.appendChild(el('button',{class:'btn-secondary', text:'등록', on:{click: async ()=>{
        if(!normalize(cInput.value)) return;
        try{
          await addComment(p.id, name, cInput.value);
          cInput.value='';
        }catch(e){}
      }}}));
      box.appendChild(cForm);
      pc.appendChild(box);
    }
    app.appendChild(pc);
  });
}

// 1. 명단 관리
function renderTeacherRoster(app){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{text:'학급 명단 관리 ('+(classData.roster||[]).length+'명)'}));

  textarea.value = (classData.roster||[]).join('\n');
  card.appendChild(textarea);

  const fileInput = el('input',{attrs:{type:'file', accept:'.txt,.csv'}});
  fileInput.addEventListener('change',(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ textarea.value=r.result; }; r.readAsText(f,'utf-8');
  });
  card.appendChild(el('label',{text:'명단 파일로 다시 덮어쓰기 (선택)'}));
  card.appendChild(fileInput);

  const err = el('p',{class:'error'}); const ok = el('p',{class:'success'});
  card.appendChild(err); card.appendChild(ok);

  card.appendChild(el('button',{class:'btn-primary', text:'명단 저장하기', on:{click: async ()=>{
    const unique = [...new Set(textarea.value.split(/[\n,]/).map(s=>s.trim()).filter(Boolean))];
    if(unique.length<2){ err.textContent='학생을 2명 이상 입력해 주세요.'; ok.textContent=''; return; }
    try{ await saveRoster(unique); err.textContent=''; ok.textContent='명단이 안전하게 저장되었어요.'; }
    catch(e){ console.error(e); err.textContent='저장 실패'; }

  // 관리자 비밀번호 변경 및 위험 영역
  const dangerCard = el('div',{class:'card'});
  dangerCard.appendChild(el('h3',{text:'관리자 비밀번호 변경'}));
  const newPin = el('input',{class:'pin-input', attrs:{type:'password', inputmode:'numeric', maxlength:'4', placeholder:'새 비밀번호 4자리'}});
  dangerCard.appendChild(newPin);
  dangerCard.appendChild(el('button',{class:'btn-secondary', text:'관리자 비밀번호 변경', on:{click: async ()=>{
    if(!/^\d{4}$/.test(newPin.value)){ alert('숫자 4자리로 입력해 주세요.'); return; }
    try{ await setTeacherPin(newPin.value); showToast('관리자 비밀번호가 변경되었어요'); }
    catch(e){ alert('변경 실패'); }
  }}}));

  dangerCard.appendChild(el('hr',{class:'dashed'}));
  dangerCard.appendChild(el('h3',{text:'⚠️ 학급 활동 초기화'}));
  dangerCard.appendChild(el('p',{class:'muted', text:'모든 편지·메시지·게시글·댓글을 삭제합니다. (명단과 학급은 유지)'}));
  dangerCard.appendChild(el('button',{class:'btn-outline-danger', text:'전체 활동 데이터 삭제', on:{click: async ()=>{
    if(!confirm('정말 모든 활동 내용을 삭제할까요? 되돌릴 수 없습니다.')) return;
    try{ await resetAllContent(); showToast('모든 활동 데이터가 초기화되었어요'); }
    catch(e){ alert('초기화 실패'); }
  }}}));
  app.appendChild(dangerCard);
}

function renderRoundManagerBlock(app, type, label, btnClass){
  const round = type==='mail' ? roundMail : roundMessage;
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{text:'🎲 '+label+' 랜덤 라운드'}));

  if(round.active){
    card.appendChild(el('span',{class:'badge round', text:'제'+round.roundNumber+'회차 라운드 진행 중'}));
    const completedList = round.completed || [];
    card.appendChild(el('p',{class:'muted', attrs:{style:'margin-top:8px;'}, text:'참여 완료율: '+completedList.length+' / '+(classData.roster||[]).length+'명'}));

    // 누가 누구에게 보내야 하는지 매칭 현황표 (교사용 핵심 기능!)
    card.appendChild(el('label',{text:'이번 라운드 매칭 현황표'}));
    const mTable = el('table',{attrs:{style:'margin-bottom:12px;'}});
    mTable.appendChild(el('tr',{},[ el('th',{text:'보내는 사람'}), el('th',{text:'받는 사람'}), el('th',{text:'진행 상태'}) ]));

    Object.entries(round.pairs || {}).forEach(([from, to])=>{
      const isDone = completedList.includes(from);
      mTable.appendChild(el('tr',{},[
        el('td',{text:from}),
        el('td',{text:to}),
        el('td',{},[ el('span',{class:'badge '+(isDone?'open':''), text: isDone ? '작성 완료 ✅' : '대기 중 ⏳'}) ])
      ]));
    });
    card.appendChild(mTable);

    card.appendChild(el('div',{class:'btn-row'},[
      el('button',{class:btnClass, text:'새로운 짝으로 다시 배정', on:{click: async ()=>{
        if(confirm('상대를 다시 무작위로 배정할까요? 기존 진행 현황은 초기화됩니다.')){
          await startRandomRound(type);
          showToast('새 라운드가 시작되었어요');
        }
      }}}),
      el('button',{class:'btn-secondary', text:'라운드 종료하기', on:{click: async ()=>{
        await endRound(type);
        showToast('라운드가 종료되었어요');
      }}})
    ]));
  } else {
    card.appendChild(el('p',{class:'muted', text:'현재 진행 중인 라운드가 없습니다. 시작하면 겹치지 않게 1:1로 짝이 지어져 모든 학생이 1회씩 주고받습니다.'}));
    card.appendChild(el('button',{class:btnClass, text:label+' 랜덤 라운드 시작', on:{click: async ()=>{
      if((classData.roster||[]).length < 2){ alert('학생이 2명 이상이어야 합니다.'); return; }
      await startRandomRound(type);
      showToast(label+' 랜덤 라운드가 시작되었어요!');
    }}}));
  }
  app.appendChild(card);
}

      mRow.appendChild(el('p',{attrs:{style:'margin:0; font-size:13.5px;'}, text:m.from+': '+m.text}));

        if(confirm('이 메시지를 삭제할까요?')) await deleteMessage(m.id);
      }}}));
      c.appendChild(mRow);
    });
    app.appendChild(c);
  });

  // 3) 누리집 글 모니터링
  app.appendChild(el('h3',{text:'🌐 학급 누리집 게시글 ('+postsAll.length+'개)', attrs:{style:'margin:20px 0 8px 4px;'}}));
  if(postsAll.length===0){ app.appendChild(el('div',{class:'empty', text:'등록된 게시글이 없습니다.'})); }
  postsAll.forEach(p=>{
    const pc = el('div',{class:'card'});
    const pHead = el('div',{class:'post-head'},[
      el('span',{class:'post-author', text:p.author+' · '+timeStr(p.ts)}),
      el('button',{class:'link-btn', text:'삭제', attrs:{style:'color:var(--danger);'}, on:{click: async ()=>{
        if(confirm('이 게시글을 삭제할까요?')) await deletePost(p.id);
      }}})
    ]);
    pc.appendChild(pHead);
    pc.appendChild(el('p',{class:'post-content', text:p.content, attrs:{style:'margin-top:6px;'}}));
    app.appendChild(pc);
  });
}

function renderTeacherReveal(app){
  // 1) 공개 정책 스위치
  const policyCard = el('div',{class:'card'});
  policyCard.appendChild(el('h3',{text:'⚙️ 학생 편지 열람 모드 설정'}));
  policyCard.appendChild(el('p',{class:'muted', text:'수업 진행 방식에 맞게 학생들이 편지를 열어보는 방식을 선택하세요.'}));

  const curPolicy = classData.letterOpenPolicy || 'self';
  const policySelect = el('select',{attrs:{style:'margin-top:10px;'}});
  policySelect.appendChild(el('option',{attrs:{value:'self', ...(curPolicy==='self'?{selected:'selected'}:{})}, text:'자율 개봉 모드 (학생이 받은 편지함을 원할 때 직접 열어보기)'}));
  policySelect.appendChild(el('option',{attrs:{value:'teacher', ...(curPolicy==='teacher'?{selected:'selected'}:{})}, text:'선생님 통제 모드 (선생님이 공개하기 전까지는 잠김 유지)'}));

  policySelect.addEventListener('change', async ()=>{
    await setLetterOpenPolicy(policySelect.value);
    showToast('편지 열람 모드가 변경되었어요');
  });
  policyCard.appendChild(policySelect);
  app.appendChild(policyCard);

  // 2) 전체 공개
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{text:'전체 편지 일괄 공개'}));
  card.appendChild(el('p',{class:'muted', text:'학급 전체가 주고받은 모든 편지에 "공개" 도장을 일괄 부여합니다.'}));
  card.appendChild(el('button',{class:'btn-sage', text:'모든 편지 일괄 공개 ('+mailsAll.filter(l=>!l.revealed).length+'통 대기 중)', on:{click: async ()=>{
    if(confirm('모든 편지를 일괄 공개하시겠습니까?')){
      await revealAllMail();
      showToast('모든 편지가 공개 처리되었어요');
    }
  }}}));
  card.appendChild(el('button',{class:'btn-secondary', text:'전체 편지 다시 비공개로 되돌리기', on:{click: async ()=>{
    if(confirm('모든 편지를 비공개로 되돌리시겠습니까?')){
      await unrevealAllMail();
      showToast('모든 편지가 비공개 상태로 전환되었어요');
    }
  }}}));
  app.appendChild(card);

  // 3) 개별 학생별 공개
  const card2 = el('div',{class:'card'});
  card2.appendChild(el('h3',{text:'특정 학생이 받은 편지만 개별 공개'}));
  card2.appendChild(el('p',{class:'muted', text:'선택한 친구가 받은 편지만 열람 가능하도록 승인합니다.'}));

  const auto = autocompleteInput('학생 이름 검색', classData.roster||[], (n)=>{ state.teacherRevealTarget=n; });
  card2.appendChild(auto.wrap);
  auto.input.value = state.teacherRevealTarget;
  auto.input.addEventListener('input', ()=>{ state.teacherRevealTarget = auto.input.value; });

  const btnRow = el('div',{class:'btn-row'});
  btnRow.appendChild(el('button',{class:'btn-sage', text:'이 학생 편지 공개', on:{click: async ()=>{
    const target = findRosterName(auto.input.value);
    if(!target){ alert('명단에 있는 학생 이름을 선택해 주세요.'); return; }
    await revealStudentMail(target, true);
    showToast(target+' 학생의 편지가 공개되었어요');
  }}}));
  btnRow.appendChild(el('button',{class:'btn-secondary', text:'이 학생 편지 비공개', on:{click: async ()=>{
    const target = findRosterName(auto.input.value);
    if(!target){ alert('명단에 있는 학생 이름을 선택해 주세요.'); return; }
    await revealStudentMail(target, false);
    showToast(target+' 학생의 편지가 비공개로 전환되었어요');
  }}}));
  card2.appendChild(btnRow);
  app.appendChild(card2);
}

// =====================================================================
// 9) 앱 부팅
// =====================================================================
render();
</script>
</body>
</html>
