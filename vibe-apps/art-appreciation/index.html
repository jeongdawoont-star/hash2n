<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단계별 미술 작품 감상</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2622; --sub:#6f665c; --line:#e2d8c6;
  --main:#2f5d8a; --main-soft:#e3edf6; --ok:#2e7d4f; --ok-soft:#e2f3e8; --no:#b8442f; --no-soft:#fbe6e1;
  --c-color:#c8553d; --c-line:#2f6fae; --c-shape:#3c8a5a; --c-tex:#7a55a8; --c-comp:#c98312;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:18px;line-height:1.65;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hd h1{font-size:20px;margin:0 8px 0 0;letter-spacing:-.02em}
.hd h1 small{display:block;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:0}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600}
nav button.on{background:var(--main);border-color:var(--main);color:#fff}
nav button.t{margin-left:auto;border-style:dashed}
main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
h2{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
h3{font-size:20px;margin:0 0 8px}
.lead{color:var(--sub);margin:0 0 20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{border:0;background:var(--main);color:#fff;border-radius:10px;padding:10px 20px;font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;font-weight:800;font-size:16px;margin-right:8px;flex:none}
.stepcard h3{display:flex;align-items:center}
.what{font-weight:800;color:var(--main)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vs>div{border-radius:12px;padding:16px;border:2px solid}
.vs .c{border-color:#d9b25f;background:#fdf5df}.vs .f{border-color:#8fb4d8;background:var(--main-soft)}
.vs b.big{font-size:22px;display:block}
.eg{margin:6px 0 0;padding-left:20px}
.lens{border-top:6px solid var(--lc);}
.lens h3{color:var(--lc)}
.lens svg{width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line)}
.badge{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--lc,var(--main));border-radius:6px;padding:1px 8px;margin-right:6px;vertical-align:2px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:16px}
button.chip:hover{border-color:var(--main)}
.chip.sel{background:var(--main);border-color:var(--main);color:#fff}
.note{background:#fff7d6;border:1px solid #ecd98a;border-radius:10px;padding:12px 14px;font-size:16px}
/* quiz */
.qbox{max-width:760px;margin:0 auto;text-align:center}
.qsent{font-size:26px;font-weight:700;margin:22px 0;min-height:84px;display:grid;place-items:center}
.qchoices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qchoices button{min-width:130px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 18px;font-size:20px;font-weight:700}
.qchoices button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qchoices button.no{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.fb{min-height:60px;margin:16px 0;font-size:17px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
/* works */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pick button{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:0;overflow:hidden;text-align:left}
.pick button:hover{border-color:var(--main);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.pick img{width:100%;height:150px;object-fit:cover;display:block}
.pick span{display:block;padding:8px 12px;font-weight:700;font-size:16px}
.pick small{display:block;font-weight:500;color:var(--sub)}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.art{position:sticky;top:76px}
.art img{width:100%;max-height:68vh;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;display:block}
.cap{font-size:14px;color:var(--sub);margin-top:6px}
.dots{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dots span{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.dots span.on{background:var(--main);color:#fff;border-color:var(--main)}.dots span.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.q{border-top:1px dashed var(--line);padding:14px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 8px;font-weight:700}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px}
.opts button:hover{border-color:var(--main)}
.opts button.ok{background:var(--ok-soft);border-color:var(--ok)}
.opts button.no{background:var(--no-soft);border-color:var(--no);animation:shake .3s}
.opts.inline{display:flex;flex-wrap:wrap}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--main);text-align:center;color:var(--main);font-weight:800;padding:0 6px}
.blank.fill{border-color:var(--ok);color:var(--ok)}
.hint{font-size:15px;color:var(--no);margin:6px 0 0;min-height:1.4em}
.hint.ok{color:var(--ok)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sent{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:19px}
.essay{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:19px;line-height:1.9;background-image:repeating-linear-gradient(transparent 0 35px,#ece4d4 35px 36px);background-position:0 16px}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:76px;resize:vertical;background:#fff}
textarea:focus{outline:2px solid var(--main);border-color:transparent}
.field{margin-bottom:18px}
.field label{font-weight:800;display:flex;align-items:center;margin-bottom:4px}
.field .tip{font-size:15px;color:var(--sub);margin:0 0 6px}
.starter{font-size:14px;padding:2px 10px;border-style:dashed}
.bank{background:var(--main-soft);border-radius:10px;padding:10px 12px;margin:8px 0}
.bank .words{margin:2px 0 6px}
.bank .chip{font-size:14px;padding:2px 10px}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(20,16,12,.9);display:none;z-index:50;place-items:center;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:96vw;max-height:96vh}
/* deck */
.deck{container-type:inline-size;background:#fffdf8;border:1px solid var(--line);border-radius:12px;aspect-ratio:16/9;position:relative;overflow:hidden}
.deck:fullscreen{border-radius:0;width:100vw;height:100vh;aspect-ratio:auto}
.slide{position:absolute;inset:0;padding:4cqw 5cqw 6cqw;font-size:2.1cqw;line-height:1.5;display:flex;flex-direction:column;justify-content:center}
.slide h2{font-size:3.6cqw;margin:0 0 1.6cqw}
.slide h2 small{font-size:1.8cqw;color:var(--main);display:block;font-weight:700}
.slide ul{margin:0;padding-left:1.4em}.slide li{margin:.5cqw 0}
.slide .cols{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;align-items:center;min-height:0;flex:1}
.slide .cols img{width:100%;max-height:100%;object-fit:contain;min-height:0}
.slide .cols>div{min-height:0;max-height:100%;display:flex;flex-direction:column;justify-content:center}
.slide svg{width:100%;height:auto;max-height:26cqw;border:1px solid var(--line);border-radius:8px;background:#fff}
.slide .vs b.big{font-size:3cqw}.slide .vs>div{padding:2cqw}
.slide .chip{font-size:1.8cqw;padding:.3cqw 1.2cqw}
.slide .four{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.slide .four div{border:2px solid var(--main);border-radius:1cqw;padding:1.4cqw;background:#fff}
.slide .four b{display:block;font-size:2.6cqw;color:var(--main)}
.rev{border:2px dashed var(--line);background:#fff;border-radius:.8cqw;padding:.6cqw 1.2cqw;margin:.5cqw 0;text-align:left;font-size:1.9cqw;width:100%;display:flex;gap:1cqw;justify-content:space-between;align-items:center}
.rev em{font-style:normal;font-weight:800;visibility:hidden;white-space:nowrap}
.rev.on em{visibility:visible}.rev.on{border-style:solid}
.rev.ans{display:block;font-size:1.45cqw;line-height:1.35;padding:.45cqw 1cqw;margin:.3cqw 0}.rev.ans span{display:block;color:var(--sub);font-size:1.2cqw}.rev.ans em{display:block;white-space:normal;color:var(--ok);font-weight:700}
.dnav{position:absolute;left:0;right:0;bottom:1cqw;display:flex;justify-content:center;gap:1cqw;align-items:center;font-size:1.5cqw;color:var(--sub)}
.dnav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3cqw 1.4cqw;font-size:1.5cqw}
#printArea{display:none}
@media (max-width:820px){.two{grid-template-columns:1fr}.art{position:static}.art img{max-height:46vh}.vs{grid-template-columns:1fr}body{font-size:17px}}
@media print{
  header,.noprint,nav{display:none!important}
  body{background:#fff;font-size:13pt}main{padding:0;max-width:none}
  .card{border:0;padding:0}.art{position:static}.art img{max-height:9cm}
  body.ws main{display:none}body.ws #printArea{display:block}
  .ws-img{max-width:100%;max-height:9.5cm;display:block;margin:0 auto 4px}
  .ws-h{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px}
  .ws-box{border:1px solid #555;border-radius:6px;padding:6px 10px;margin-top:6px;break-inside:avoid}
  .ws-box b{font-size:12pt}.ws-box small{display:block;color:#444}
  .ws-line{border-bottom:1px solid #999;height:26px}
  .ws-bank{font-size:10.5pt;margin-top:2px}
}
</style>
</head>
<body>
<header><div class="hd">
  <h1>단계별 미술 작품 감상<small>5학년 미술 · 작품 속 내용과 형식</small></h1>
  <nav id="nav">
    <button data-v="learn">① 배우기</button>
    <button data-v="quiz">② 퀴즈</button>
    <button data-v="guide">③ 단계별 학습지</button>
    <button data-v="free">④ 감상 연습</button>
    <button data-v="teacher" class="t">교사용 강의</button>
  </nav>
</div></header>
<main id="main"></main>
<div id="lb"><img alt=""></div>
<div id="printArea"></div>

<script>
/* ---------- 자료 ---------- */
const LENS=[
 {k:'색',c:'var(--c-color)',q:'어떤 색을 썼나요?',d:'따뜻한지 차가운지, 밝은지 어두운지, 어떤 색끼리 만났는지 봅니다.',
  w:['따뜻한 색','차가운 색','밝은','어두운','선명한','은은한','대비되는','비슷한 색끼리'],
  svg:`<rect x="10" y="10" width="40" height="40" fill="#d8432e"/><rect x="50" y="10" width="40" height="40" fill="#ee8a2b"/><rect x="90" y="10" width="40" height="40" fill="#f3c93b"/><text x="70" y="64" text-anchor="middle" font-size="11">따뜻한 색</text><rect x="150" y="10" width="40" height="40" fill="#1f4f8f"/><rect x="190" y="10" width="40" height="40" fill="#3f8fc4"/><rect x="230" y="10" width="40" height="40" fill="#7fc4b8"/><text x="210" y="64" text-anchor="middle" font-size="11">차가운 색</text><rect x="10" y="76" width="120" height="34" fill="#1d2f5e"/><circle cx="70" cy="93" r="12" fill="#f6d743"/><text x="70" y="124" text-anchor="middle" font-size="11">대비되는 색</text><rect x="150" y="76" width="120" height="34" fill="#d9c9a8"/><circle cx="210" cy="93" r="12" fill="#c9b38a"/><text x="210" y="124" text-anchor="middle" font-size="11">비슷한 색</text>`},

 {k:'형',c:'var(--c-shape)',q:'모양을 어떻게 나타냈나요?',d:'둥근지 각진지, 단순한지 자세한지, 실제보다 크게·작게 바꾸었는지 봅니다.',
  w:['둥근','각진','단순한','자세한','크게','작게','과장된'],
  svg:`<circle cx="45" cy="45" r="30" fill="#3c8a5a"/><text x="45" y="96" text-anchor="middle" font-size="11">둥근 형</text><path d="M110 75l30-60 30 60z" fill="#3c8a5a"/><text x="140" y="96" text-anchor="middle" font-size="11">각진 형</text><g fill="none" stroke="#222" stroke-width="2.5"><circle cx="230" cy="42" r="26"/><circle cx="221" cy="36" r="2.5" fill="#222"/><circle cx="239" cy="36" r="2.5" fill="#222"/><path d="M219 52q11 9 22 0"/></g><text x="230" y="96" text-anchor="middle" font-size="11">단순한 형</text>`},

  w:['거친','매끈한','붓 자국이 보이는','점을 찍어','번지게','판화로 찍어','두껍게 칠해'],
  svg:`<defs><pattern id="pd" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#7a55a8"/><circle cx="6" cy="6" r="1.6" fill="#e0a12a"/></pattern><pattern id="ps" width="14" height="10" patternUnits="userSpaceOnUse"><path d="M1 7q4-6 9-2" stroke="#7a55a8" stroke-width="3" fill="none" stroke-linecap="round"/></pattern></defs><rect x="12" y="12" width="76" height="62" fill="url(#pd)"/><text x="50" y="94" text-anchor="middle" font-size="11">점을 찍어</text><rect x="102" y="12" width="76" height="62" fill="url(#ps)"/><text x="140" y="94" text-anchor="middle" font-size="11">붓 자국</text><rect x="192" y="12" width="76" height="62" fill="#7a55a8"/><text x="230" y="94" text-anchor="middle" font-size="11">매끈하게</text>`},

  w:['가운데에','한쪽에','둥글게 둘러','대각선으로','앞은 크게 뒤는 작게','배경을 비워','화면 가득'],
  svg:`<g fill="none" stroke="#999"><rect x="10" y="12" width="78" height="60"/><rect x="101" y="12" width="78" height="60"/><rect x="192" y="12" width="78" height="60"/></g><circle cx="49" cy="42" r="16" fill="#c98312"/><text x="49" y="92" text-anchor="middle" font-size="11">가운데에 크게</text><g fill="#c98312"><circle cx="140" cy="22" r="4"/><circle cx="160" cy="32" r="4"/><circle cx="164" cy="52" r="4"/><circle cx="140" cy="62" r="4"/><circle cx="118" cy="52" r="4"/><circle cx="116" cy="32" r="4"/></g><text x="140" y="92" text-anchor="middle" font-size="11">둥글게 둘러</text><path d="M196 68L266 16" stroke="#c98312" stroke-width="5"/><circle cx="208" cy="52" r="9" fill="#c98312"/><circle cx="254" cy="20" r="3" fill="#c98312"/><text x="231" y="92" text-anchor="middle" font-size="11">대각선·크기 차이</text>`}
];
const lens=k=>LENS.find(l=>l.k===k);
const FEELS=['신나는','재미있는','평화로운','따뜻한','시원한','신기한','무서운','불안한','쓸쓸한','웅장한','활기찬','고요한'];
const EVALS=['다른 사람에게 소개하고 싶은','오래 기억에 남을','볼수록 새로운 것이 보이는','나도 따라 표현해 보고 싶은'];

const WORKS=[
{id:'ssireum',img:'images/ssireum.jpg',t:'씨름',a:'김홍도',info:'김홍도(한국/1745~1806?) 씨름(종이에 수묵 담채/26.9×22.2cm/18세기 후반)',
 reasons:['둘러앉아 구경하는 사람들','힘을 쓰는 두 씨름꾼','사람들의 여러 가지 표정','엿을 파는 아이'],
 content:[{q:'무엇을 하는 장면인가요?',o:['사람들이 둥글게 둘러앉아 씨름 경기를 구경하고 있어요.','사람들이 교실에서 공부를 하고 있어요.','사람들이 시장에서 물건을 사고 있어요.']},

function vQuiz(){
 main.innerHTML=`<h2>② 퀴즈 — 배운 것 확인하기</h2><p class="lead">세 가지 퀴즈를 차례로 풀어 보세요.</p>
 <div class="grid g2" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${QUIZ.map((q,i)=>`<div class="card"><h3>퀴즈 ${i+1}. ${q.name}</h3><p class="cap">${q.desc}</p><button class="btn" data-quiz="${i}">시작 (${q.items.length}문제)</button></div>`).join('')}</div>`;
 $$('[data-quiz]').forEach(b=>b.onclick=()=>runQuiz(+b.dataset.quiz));
}
function runQuiz(qi){
 const Q=QUIZ[qi],items=shuffle(Q.items);let i=0,score=0,first=true;
 const draw=()=>{
  if(i>=items.length){
   main.innerHTML=`<div class="card qbox"><h2>${Q.name}</h2><p class="qsent">${items.length}문제 중 ${score}문제를 한 번에 맞혔어요</p>
   <p>${score===items.length?'완벽해요. 다음으로 넘어가도 좋아요.':score>=items.length*0.7?'잘했어요. 틀린 문제의 설명을 떠올려 보세요.':'① 배우기를 한 번 더 읽고 다시 도전해 보세요.'}</p>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="re">다시 풀기</button>${qi<QUIZ.length-1?`<button class="btn" id="nx">다음 퀴즈 →</button>`:`<button class="btn" data-go="guide">단계별 학습지로 →</button>`}<button class="btn ghost" data-go="quiz">퀴즈 목록</button></div></div>`;
   $('#re').onclick=()=>runQuiz(qi); if($('#nx'))$('#nx').onclick=()=>runQuiz(qi+1); return;
  }
  const it=items[i];first=true;
  main.innerHTML=`<div class="card qbox"><div class="row" style="justify-content:space-between"><b>퀴즈 ${qi+1}. ${Q.name}</b><span>${i+1} / ${items.length}</span></div>
   <div class="bar"><i style="width:${i/items.length*100}%"></i></div>
   <div class="qsent">“${it[0]}”</div>
   <div class="qchoices">${Q.ch.map((c,k)=>`<button data-k="${k}">${c}</button>`).join('')}</div>
   <div class="fb" id="fb"></div><button class="btn" id="next" disabled>다음 →</button></div>`;
  $$('.qchoices button').forEach(b=>b.onclick=()=>{
   const fb=$('#fb');
   if(+b.dataset.k===it[1]){b.className='ok';fb.className='fb ok';fb.textContent='맞아요! '+it[2];if(first)score++;$$('.qchoices button').forEach(x=>x.disabled=true);$('#next').disabled=false}
   else{b.className='no';b.disabled=true;first=false;fb.className='fb no';fb.textContent=qi===0?'다시 생각해 보세요. “무엇이 있는지”를 말했나요, “어떻게 그렸는지”를 말했나요?':'다시 생각해 보세요.'}
  });
  $('#next').onclick=()=>{i++;draw()};
 };
 draw();
}

  <img class="ws-img" src="${w.img}"><div style="font-size:10pt;text-align:center">${esc(w.info)}</div>
  <div class="ws-box"><b>① 반응하기</b><small>작품을 보니 (　　　　) 느낌이 들어요. (　　　　　　　　) 때문이에요.</small>${lines(1)}</div>
  <div class="ws-box"><b>② 분석하기 — 내용 (무엇을 표현했나요?)</b><small>작품에는 ~이/가 ~하고 있어요.</small>${lines(2)}</div>
  <div class="ws-box"><b>② 분석하기 — 형식 (어떻게 표현했나요?)</b><small>~ 색(선, 형, 방법, 구도)으로 표현해서 ~ 느낌이 나요.</small>
   <div class="ws-bank">${LENS.map(l=>`<b>${l.k}</b> ${l.w.join(', ')}`).join(' / ')}</div>${lines(3)}</div>
  <div class="ws-box"><b>③ 의미 해석하기</b><small>미술가는 ~을/를 나타내고 싶었던 것 같아요.</small>${lines(2)}</div>
  <div class="ws-box"><b>④ 종합 평가하기</b><small>~ 점이 인상 깊어서 ~ 작품이라고 생각해요.</small>${lines(2)}</div>`;
 document.body.classList.add('ws');
 const img=$('#printArea img');const go=()=>{print();document.body.classList.remove('ws')};
 img.complete?go():img.onload=go;
}

/* ---------- 이동 ---------- */
const VIEWS={learn:vLearn,quiz:vQuiz,guide:vGuide,free:vFree,teacher:vTeacher};
function go(v){$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));VIEWS[v]();scrollTo(0,0);try{history.replaceState(null,'','#'+v)}catch(e){}}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
main.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
go(VIEWS[location.hash.slice(1)]?location.hash.slice(1):'learn');
</script>
</body>
