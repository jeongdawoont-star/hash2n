<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>퍼스트클래스 라운지</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛫%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 퍼스트클래스(교사용)와 같은 항공 테마: 네이비 + 골드. 학생용이라 버튼을 크게, 화면 한 장 고정. */
:root{
  --bg:#ECF1F7;--surface:#fff;--surface-2:#F3F6FA;--ink:#14213D;--muted:#5A6882;--line:#D4DCE8;
  --navy:#14213D;--accent:#1B3A6B;--gold:#C9A227;--gold-2:#F5E9C8;
  --up:#D2353B;--down:#2563C9;--ok:#23845A;--warn:#B8800E;--bad:#C0392B;--pink:#C44D6C;
  --f-d:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;--f-b:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --top:58px;--dock:74px;--r:14px;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-b);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--top) 1fr var(--dock)}
/* top */
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-size:22px;letter-spacing:.5px;white-space:nowrap}
.brand small{font-family:var(--f-b);font-size:11px;opacity:.7;letter-spacing:1px}
.top .sp{flex:1}
.conn{font-size:11.5px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.conn.cloud::before{content:"●";color:#4ADE80;margin-right:4px}.conn.demo::before{content:"●";color:#FBBF24;margin-right:4px}.conn.err::before{content:"●";color:#F87171;margin-right:4px}
.chip-me{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--navy);padding:5px 6px 5px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
.chip-me .idle{font-size:11px;font-weight:600;opacity:.8}
.chip-me button{border:0;background:var(--navy);color:#fff;border-radius:99px;padding:4px 10px;font-size:12.5px}
.tbtn{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:99px;padding:5px 11px;font-size:13px;white-space:nowrap}
.tbtn.on{background:#fff;color:var(--navy)}
/* main */
main{position:relative;overflow:hidden;padding:12px 14px;min-height:0}
.view{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vhead h1{margin:0;font-family:var(--f-d);font-weight:400;font-size:26px;white-space:nowrap}
.vhead .sp{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.body{flex:1;min-height:0;display:flex;gap:12px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.fill{flex:1;min-height:0}
.scroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;white-space:nowrap}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.red{background:var(--up);border-color:var(--up);color:#fff}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:#E3F4EA;border-color:#B7E0C7;color:var(--ok)}.pill.warn{background:#FFF4D6;border-color:#F0D88F;color:var(--warn)}.pill.bad{background:#FDE8E7;border-color:#F3C1BD;color:var(--bad)}.pill.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted);padding:20px}
.empty .big{font-size:52px}
/* dock */
.dock{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.dock button{border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:13px;color:var(--muted)}
.dock button .i{font-size:25px;line-height:1}
.dock button[aria-current=true]{background:var(--navy);color:#fff}
.dock button{position:relative}
.dock button .dot{position:absolute;top:5px;left:calc(50% + 12px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--up);color:#fff;font-size:11px;line-height:18px;border:2px solid var(--surface)}
.help{border:1px solid var(--line);background:var(--gold-2);color:var(--navy);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13.5px;white-space:nowrap;cursor:pointer}
.howto{display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.55}
.howto .ex{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
/* card news */
.cnews{display:flex;flex-direction:column;gap:14px;min-height:360px}
.cnews-card{background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);border:2px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 16px rgba(15,23,42,.06);position:relative;overflow:hidden}
.cnews-tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--navy);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:99px}
.cnews-title{font-size:18px;font-weight:800;color:var(--navy);line-height:1.35;margin:0}
.cnews-desc{font-size:14.5px;line-height:1.6;color:#334155;margin:0}
.cnews-mock{background:#ffffff;border:1.5px dashed #cbd5e1;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.02)}
.cnews-mock-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.cnews-mock-ui{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cnews-tip{background:#fffbeb;border:1px solid #fef08a;color:#854d0e;border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.45;font-weight:600}
.cnews-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.cnews-dots{display:flex;align-items:center;gap:7px}
.cnews-dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;cursor:pointer;border:0;padding:0;transition:all .2s ease}
.cnews-dot.on{width:22px;border-radius:99px;background:var(--navy)}
.todo{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.todo .ic{font-size:26px;width:34px;text-align:center}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:15px}
.todo.hot{background:#FFFBEA}
.saved{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
.saved.ing{color:var(--warn)}
/* name grid / login */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));grid-auto-rows:1fr;gap:8px;flex:1;min-height:0}
.names button{border:1px solid var(--line);background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:17px;min-height:48px;padding:4px}
.names button small{font-size:11px;color:var(--muted);font-weight:600}
.names button.F{border-bottom:3px solid #E8A7B8}.names button.M{border-bottom:3px solid #A7C0E8}
.names button:active{transform:scale(.97);background:var(--gold-2)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,18,36,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:calc(100dvh - 28px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal .mh{padding:16px 18px 8px;display:flex;align-items:center;gap:8px}
.modal .mh h3{margin:0;font-size:19px;flex:1}
.modal .mb{padding:6px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal .mf{padding:10px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.pin{display:flex;flex-direction:column;align-items:center;gap:12px}
.pin .who{font-family:var(--f-d);font-size:30px}
.pin .dots{display:flex;gap:14px}.pin .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--navy)}.pin .dots i.on{background:var(--navy)}
.pin .dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.pad button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:26px;font-weight:700}
.pad button:active{background:var(--gold-2)}
.toast{position:fixed;left:50%;bottom:calc(var(--dock) + 16px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
/* home */
.hero{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 18px;border-bottom:4px solid var(--gold)}
.hero h1{margin:0;font-family:var(--f-d);font-weight:400;font-size:28px}
.hero p{margin:2px 0 0;opacity:.8;font-size:14px}
.notice{background:var(--gold-2);border:1px solid #E6D49A;border-radius:12px;padding:9px 13px;font-weight:600;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;flex:1;min-height:0}
.tile{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.tile .k{font-size:13px;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--f-d);font-size:32px;line-height:1.1}
.tile .s{font-size:13px;color:var(--muted)}
.tile .em{font-size:26px}
/* seat / stock board */
.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.chalk{background:var(--navy);color:var(--gold-2);text-align:center;border-radius:8px;padding:4px;font-family:var(--f-d);border-bottom:3px solid var(--gold);font-size:15px}
.sgrid{flex:1;min-height:0;display:grid;gap:5px}
.sgrid.list{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));grid-auto-rows:minmax(52px,1fr)}
.cell{position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px 7px;display:flex;flex-direction:column;justify-content:center;min-height:0;min-width:0;overflow:hidden}
.cell .n{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .n small{color:var(--muted);font-weight:600;font-size:10.5px;margin-right:3px}
.cell .m{display:flex;gap:6px;font-size:12px;align-items:baseline;white-space:nowrap}
.cell .heat{position:absolute;inset:0;background:var(--gold);opacity:var(--h,0);pointer-events:none}
.cell>*{position:relative}
.cell .inv{position:absolute;right:5px;top:3px;font-size:11px;font-weight:800;color:var(--navy)}
.up{color:var(--up)}.dn{color:var(--down)}
.aisle{background:transparent}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
/* invest */
.ibar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.ibar .bud{font-family:var(--f-d);font-size:22px}
.meter{flex:1;min-width:140px;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--gold)}
.igrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));grid-auto-rows:minmax(64px,1fr);gap:6px}
.icell{border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;justify-content:center;padding:6px 8px;gap:4px;min-height:0;overflow:hidden}
.icell .bot{display:flex;align-items:center;justify-content:space-between;gap:4px}
.icell.on{border-color:var(--gold);background:#FFFBEA;box-shadow:inset 0 0 0 1px var(--gold)}
.icell .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icell .sub{font-size:11px;color:var(--muted)}
.stp{display:flex;align-items:center;gap:3px}
.stp button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:700;line-height:1}
.stp b{min-width:24px;text-align:center;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:700;position:sticky;top:0;background:#fff}
table.t td.r,table.t th.r{text-align:right}
/* manito */
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:700}
.steps span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps span.done{background:#E3F4EA;color:var(--ok);border-color:#B7E0C7}
.secret{background:linear-gradient(135deg,#1B3A6B,#14213D);color:#fff;border-radius:16px;padding:16px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none;border:2px dashed var(--gold)}
.secret .q{font-size:13px;opacity:.8}
.secret .nm{font-family:var(--f-d);font-size:40px;color:var(--gold-2);min-height:52px;display:flex;align-items:center;justify-content:center}
.mis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.mis .mi{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;text-align:left;font-weight:600;font-size:13.5px}
.mis .mi b{margin-left:auto;font-size:12px;background:var(--gold-2);border-radius:99px;padding:1px 8px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));grid-auto-rows:minmax(44px,1fr);gap:6px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:14.5px;padding:4px}
.pick button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.pick button:disabled{opacity:.35}
.rules{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
.log{font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.log div{display:flex;gap:8px}.log time{color:var(--muted);white-space:nowrap}
/* reveal show */
.show{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 30%,#2A4A82,#0B1428 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.show .cnt{position:absolute;top:16px;left:20px;font-size:15px;opacity:.7}
.show .close{position:absolute;top:14px;right:16px}
.show .q{font-family:var(--f-d);font-size:clamp(28px,5vw,54px)}
.show .guess{font-size:clamp(17px,2.4vw,24px);opacity:.9}
.show .ans{font-family:"Black Han Sans",var(--f-d);font-size:clamp(56px,11vw,130px);color:var(--gold);min-height:1.2em;text-shadow:0 6px 30px rgba(201,162,39,.5)}
.show .ans.spin{animation:flick .09s steps(1) infinite;color:#fff;opacity:.85}
.show .ans.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes flick{50%{opacity:.6}}
.show .res{font-size:clamp(22px,3.4vw,38px);font-weight:800;min-height:1.3em}
.show .res.o{color:#4ADE80}.show .res.x{color:#FCA5A5}
.show .btns{display:flex;gap:10px}
.show .btn{min-height:52px;font-size:18px;padding:0 26px}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* contest */
.clist{width:300px;flex:none;display:flex;flex-direction:column;gap:8px}
.citem{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center}
.citem[aria-current=true]{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.citem .e{font-size:30px}
.citem .tt{font-weight:800;font-size:15px}
.cdetail{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.pwrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line);padding:10px}
.pscale{transform-origin:top left;flex:none}
/* poster (A4 @96dpi = 794x1123) */
.poster{width:794px;height:1123px;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:var(--f-b);background:#fff;color:#14213D}
.poster .ph{padding:56px 60px 30px;text-align:center}
.poster .tag{display:inline-block;font-weight:800;letter-spacing:4px;font-size:18px;padding:6px 18px;border-radius:99px}
.poster .em{font-size:150px;line-height:1.1;margin:18px 0 6px}
.poster h1{margin:0;font-family:"Black Han Sans",var(--f-d);font-weight:400;font-size:84px;line-height:1.08;word-break:keep-all}
.poster .ds{font-size:26px;margin-top:16px;font-weight:600;word-break:keep-all}
.poster .pinfo{margin:10px 60px 0;display:grid;grid-template-columns:150px 1fr;gap:0;border-top:3px solid currentColor}
.poster .pinfo div{padding:14px 6px;border-bottom:1px solid rgba(0,0,0,.15);font-size:23px;white-space:pre-line;word-break:keep-all}
.poster .pinfo .k{font-weight:800}
.poster .pf{margin-top:auto;display:flex;align-items:flex-end;gap:20px;padding:24px 60px 44px}
.poster .pf .how{flex:1;font-size:22px;font-weight:700;line-height:1.5}

function seatGrid(cell) {

  const keys = L.seats.filter(k => { const [r, x] = k.split('-').map(Number); return r < L.rows && x < L.cols; });
  if (!keys.length) return listGrid(cell);
  const rU = [...new Set(keys.map(k => +k.split('-')[0]))].sort((a, b) => a - b), cU = [...new Set(keys.map(k => +k.split('-')[1]))].sort((a, b) => a - b);
  const set = new Set(keys); let rows = [], cols = [];
  for (let r = rU[0]; r <= rU.at(-1); r++) rows.push(r);
  for (let x = cU[0]; x <= cU.at(-1); x++) cols.push(x);
  if (flip) { rows.reverse(); cols.reverse(); }
  const seated = new Set(Object.values(m.current || {}));
  let h = '';
  for (const r of rows) for (const x of cols) { if (!cU.includes(x)) { h += '<div class="aisle"></div>'; continue; } const k = r + '-' + x; const id = set.has(k) ? m.current?.[k] : null; h += id && stu(id) ? cell(stu(id)) : '<div></div>'; }
  const rest = roster().filter(s => !seated.has(s.id));
  const chalk = '<div class="chalk">칠 판</div>';
  return `<div class="board">${flip ? '' : chalk}<div class="sgrid" style="grid-template-columns:${cols.map(x => cU.includes(x) ? 'minmax(0,1fr)' : '12px').join(' ')};grid-template-rows:repeat(${rows.length},minmax(0,1fr))">${h}</div>${flip ? chalk : ''}
  ${rest.length ? `<div class="sgrid list" style="flex:none;grid-auto-rows:52px">${rest.map(cell).join('')}</div>` : ''}</div>`;
}

      <label class="f">성장률 최소 분모<input type="number" id="stFloor" value="${st.floor}" style="width:90px"></label>
      <label class="f">1점 환전 금액(만원)<input type="number" id="stRate" value="${st.rate / 10000}" style="width:110px"></label>
      <label class="f">환전 수수료(%)<input type="number" id="stFee" value="${st.fee ?? 10}" min="0" max="100" style="width:85px"></label>

    <div class="card col fill"><h2>💱 환전 신청 ${reqs.length ? `<span class="pill warn">${reqs.length}</span>` : ''}</h2><div class="scroll fill">

      <p class="small muted">승인하면 지갑에서 돈이 빠지고, 칭찬 점수는 <b>퍼스트클래스에 자동으로 +</b>돼요 (퍼스트클래스가 켜져 있을 때 반영, 그 전에도 라운지 점수에는 바로 보여요).</p></div></div></div>

A.stSave = async () => { await DB.set('app/settings', { stock: { budget: $('#stBudget').value, fixed: +$('#stFixed').value || 20, minBudget: Math.max(0, Math.floor(+$('#stMin').value || 0)), floor: Math.max(1, +$('#stFloor').value || 10), rate: Math.max(1, +$('#stRate').value || 100) * 10000, fee: Math.max(0, +$('#stFee').value || 0), allowSelf: $('#stSelf').value === '1', unit: 1000000 } }); toast('저장했어요'); };
A.roundNew = () => {
  const n = Object.keys(S.stock?.rounds || {}).length + 1, end = new Date(Date.now() + 7 * DAY).toLocaleDateString('sv');
  const m = modal(`${mHead('새 주식 라운드')}<div class="mb"><label class="f">라운드 이름<input type="text" id="rT" value="${n}회차 주식 (${new Date().getMonth() + 1}월)"></label><label class="f">마감 예정일<input type="date" id="rE" value="${end}"></label><p class="small muted" style="margin:0">지금 칭찬 점수가 시작 점수로 기록돼요.</p></div><div class="mf"><button class="btn" data-a="closeModal">취소</button><button class="btn p" id="rOk">열기</button></div>`);
  m.querySelector('#rOk').onclick = async () => {
    const id = uid(), base = Object.fromEntries(roster().map(s => [s.id, sc(s.id)]));
    await DB.set('app/stock', { cur: id, rounds: { [id]: { id, title: $('#rT').value || '주식 라운드', end: $('#rE').value, at: Date.now(), status: 'open', base } } });
    closeModal(); toast('새 라운드를 열었어요');
  };
};
A.roundClose = () => confirmBox('투자를 마감할까요? 학생들은 더 이상 투자를 바꿀 수 없어요.', async () => { await DB.update('app/stock', { [`rounds.${S.stock.cur}.status`]: 'closed' }); });
A.roundSettle = () => {
  const R = curRound(); confirmBox(`'${R.title}'을(를) 지금 점수로 정산할까요?\n성장률만큼 학생 지갑에 돈이 들어가고 되돌릴 수 없어요.`, async () => {
    const st = ST(), final = {}, rate = {};
    for (const s of roster()) { final[s.id] = sc(s.id); rate[s.id] = (final[s.id] - (+R.base?.[s.id] || 0)) / Math.max(+R.base?.[s.id] || 0, st.floor); }
    const jobs = [];
    for (const [sid, w] of Object.entries(S.wallets)) {
      const m = w.inv?.[R.id]; if (!m || !Object.keys(m).length) continue;
      let principal = 0, profit = 0; for (const [t, p] of Object.entries(m)) { principal += p * st.unit; profit += p * st.unit * (rate[t] || 0); }
      profit = Math.round(profit / 10000) * 10000;
      jobs.push(DB.update('wallets/' + sid, { cash: (w.cash || 0) + profit, log: [...(w.log || []), { rid: R.id, title: R.title, principal, profit, at: Date.now() }] }));
    }
    jobs.push(DB.update('app/stock', { [`rounds.${R.id}.status`]: 'settled', [`rounds.${R.id}.final`]: final, [`rounds.${R.id}.rate`]: rate, [`rounds.${R.id}.settledAt`]: Date.now() }));
    await Promise.all(jobs); toast(`정산 완료! ${jobs.length - 1}명의 지갑에 반영했어요`);
  }, '정산하기');
};
A.exDo = async d => {
  const w = S.wallets[d.sid], e = (w.ex || []).find(e => e.id === d.id); if (!e || e.st !== 'req') return;
  const ok = d.ok === '1', ex = (w.ex || []).map(x => x.id === d.id ? { ...x, st: ok ? 'ok' : 'no', done: Date.now() } : x), f = { ex };
  if (ok) f.cash = (w.cash || 0) - e.cost;
  await DB.update('wallets/' + d.sid, f);
  // 칭찬 점수 가산은 태도 감점과 같은 통로(app/attitude)로 퍼스트클래스에 보냄. pts가 음수 = 가산
  if (ok) await DB.update('app/attitude', { ['pen.ex' + e.id]: { sid: d.sid, pts: -e.pts, at: Date.now(), applied: false, kind: 'ex', reason: `주식 환전 ${won(e.cost)}` } });
  toast(ok ? `${nm(d.sid)} 칭찬 +${e.pts}점 — 퍼스트클래스에 자동으로 들어가요` : '반려했어요');
};

  // done

/** 마니또가 '했어요' 한 미션과 받은 친구가 '받았어요' 한 미션을 같은 미션·같은 날로 짝지어 확인 */
function crossCheck(giver, recv) {
  const did = (S.manis[giver]?.did || []).slice().sort((a, b) => a.at - b.at), got = (S.manis[recv]?.got || []).slice(); const used = new Set();
  const rows = did.map(x => { const i = got.findIndex((g, k) => !used.has(k) && g.m === x.m && todayKey(g.at) === todayKey(x.at) && g.at >= x.at - 3600000); if (i >= 0) used.add(i); return { ...x, ok: i >= 0, gotAt: i >= 0 ? got[i].at : null, guessed: i >= 0 && got[i].from === giver }; });
  return { rows, ok: rows.filter(r => r.ok).length, did: did.length, got: got.length };
}
function maniStatsHtml() {
  const P = S.mani?.pairs || {}, recvs = Object.values(P); if (!recvs.length) return '<span class="muted">짝이 없어요</span>';
  const giverOf = r => Object.keys(P).find(g => P[g] === r);
  const hit = recvs.filter(r => S.manis[r]?.guess && S.manis[r].guess === giverOf(r)), guessed = recvs.filter(r => S.manis[r]?.guess);
  const king = Object.keys(P).map(g => [g, (S.manis[g]?.did || []).length]).sort((a, b) => b[1] - a[1])[0];
  return `<div style="font-family:var(--f-d);font-size:34px">${hit.length} / ${guessed.length}명 정답</div><p class="small muted" style="margin:2px 0 8px">예측한 ${guessed.length}명 중 ${guessed.length ? Math.round(hit.length / guessed.length * 100) : 0}%가 맞췄어요</p>

/* 선생님 자동 감상 (Google Gemini 무료 API)
   키는 이 기기 브라우저에만 저장(공개 저장소·Firestore에 올리지 않음). 키가 있는 기기가 켜져 있으면
   '감상 기다림' 그림을 하나씩 가져가서(busy 표시로 다른 기기와 겹치지 않게) 감상을 써 넣음 */
const AI_KEY = 'fclounge.ai', DEV = uid();
const aiCfg = () => { try { return JSON.parse(localStorage.getItem(AI_KEY) || '{}'); } catch (e) { return {}; } };
let gemModels = null, aiBusy = false;
async function gemDiscover(key) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
  if (res.status === 400 || res.status === 401 || res.status === 403) throw new Error('키가 맞지 않아요 (' + res.status + ')');
  if (!res.ok) return ['gemini-2.5-flash', 'gemini-2.0-flash'];
  const data = await res.json(), sc = n => (parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/i) || [])[1]) || 0) + (/flash/i.test(n) ? 4 : 0) + (/-latest$/.test(n) ? 2 : 0) - (/lite/i.test(n) ? 1 : 0) - (/preview|exp/i.test(n) ? 3 : 0);
  const ms = (data.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace(/^models\//, '')).filter(n => /gemini/i.test(n) && !/tts|embed|aqa|image|live|audio|thinking/i.test(n)).sort((a, b) => sc(b) - sc(a));
  return ms.length ? ms : ['gemini-2.5-flash', 'gemini-2.0-flash'];
}
async function geminiPraise(key, b64, w) {
  if (!gemModels) gemModels = await gemDiscover(key);
  const full = w.by ? nm(w.by) : '', first = full.length >= 3 ? full.slice(1) : full; // 성은 빼고 이름만 보냄
  const prompt = `너는 ${S.main?.cname || '초등학교'} 담임 선생님이야. ${first ? `학생 '${first}'` : '선생님'}이(가) 학급 그림 담벼락에 올린 작품${w.title ? ` (제목: "${w.title}")` : ''} 사진을 보고 감상 댓글을 써 줘.
[지침]
1. 그림에서 실제로 보이는 것(색깔, 그린 대상, 선과 모양, 구도, 재미있는 아이디어) 중 2가지 이상을 구체적으로 짚어서 칭찬해.
2. 다정한 선생님 말투(예: "~했구나!", "~이 정말 멋지다")로, 초등학생이 읽고 뿌듯해지게 2~3문장, 150자 이내로 써. 이모지는 1개까지.
3. 점수 매기기, 다른 친구와 비교, 고칠 점 지적은 하지 마.
4. 사진이 그림·만들기 작품이 아니고 사람 얼굴, 교실 풍경, 글씨만 있는 화면 같은 것이면 art를 false로 하고 praise는 "그림이나 만들기 작품을 올려 주면 선생님이 감상을 써 줄게!"로 해.
반드시 JSON으로만 답해: {"art": true, "praise": "감상"}`;
  let last;
  for (const m of gemModels.slice(0, 4)) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: 'user', parts: [{ inline_data: { mime_type: 'image/jpeg', data: b64 } }, { text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: .9 } }) });
      if (res.status === 401 || res.status === 403) throw Object.assign(new Error('키가 맞지 않아요 (' + res.status + ')'), { fatal: 1 });
      if (!res.ok) { last = new Error(`${m} 응답 ${res.status}${res.status === 429 ? ' (무료 사용량 초과 — 잠시 뒤 다시)' : ''}`); continue; }
      const data = await res.json(), raw = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
      const j = JSON.parse(raw.replace(/```json|```/g, '').trim()), o = Array.isArray(j) ? j[0] : j;
      if (o && (o.praise || o.art === false)) return { art: o.art !== false, praise: String(o.praise || '').trim().slice(0, 300) };
      last = new Error('감상이 비어 있어요');

  }

}

function repStats() {

  const xs = rows.map(r => r.u), mu = xs.reduce((a, b) => a + b, 0) / Math.max(1, xs.length), sd = Math.sqrt(xs.reduce((a, b) => a + (b - mu) ** 2, 0) / Math.max(1, xs.length));

}

          <div>③ 학생들은 카메라로 QR을 찍고 <b>출석번호와 생일 6자리 비밀번호</b>로 로그인합니다.</div>
        </div>
      </div>
      <div style="background:var(--sel-bg, #fff3c8);border:1px solid var(--chalk, #c9a227);border-radius:10px;padding:10px;font-size:12.5px;color:var(--sel-ink, #8a6a00)">
        <b>💡 30일 뒤 만료 방지 팁</b>: Firebase 콘솔 → Firestore → [규칙(Rules)] 탭에서 <code>allow read, write: if true;</code> 로 저장하시면 1년 내내 만료 없이 안심하고 쓰실 수 있습니다.
      </div>
    </div>
  `);
};
/** 학생 폰용 주소. 배포용 파일(설정 내장)이면 짧은 주소, 아니면 설정을 #c=에 담음(QR이 촘촘해짐) */
function studentLink() {
  const link = appUrl(); if (!link) return '';
  if (FILE_CONFIG.firebase) return link + (link.includes('?') ? '&' : '?') + 'phone';
  // QR이 촘촘해지지 않게 Firestore에 꼭 필요한 값만 담음
  const fb = CFG.fb ? Object.fromEntries(['apiKey', 'authDomain', 'projectId'].filter(k => CFG.fb[k]).map(k => [k, CFG.fb[k]])) : null;
  return link + '#c=' + encodeURIComponent(b64e(JSON.stringify({ code: CFG.code, fb }))) + '&phone';
}
/** 지금 열린 라운지에 연결 설정(학급 코드·Firebase)을 넣은 index.html을 만들어 내려받기 → Netlify Drop에 올리면 끝 */
A.deploy = () => {
  if (!CFG.fb) return toast('Firestore 연결 후에 만들 수 있어요');
  const root = document.documentElement.cloneNode(true);
  root.querySelectorAll('#main,#dock,#meSlot,#modalRoot,#printArea').forEach(e => e.innerHTML = '');
  root.querySelectorAll('body > :not(#app):not(#modalRoot):not(#printArea):not(script)').forEach(e => e.remove());
  const cn = root.querySelector('#conn'); cn.className = 'conn'; cn.textContent = '연결 중…';
  const tb = root.querySelector('#tBtn'); tb.className = 'tbtn'; tb.textContent = '🔑';
  const sc = root.querySelector('script[type=module]');
  const line = `const FILE_CONFIG = { code: ${JSON.stringify(CFG.code)}, firebase: ${JSON.stringify(CFG.fb)} };`;
  if (!/const FILE_CONFIG = \{[^\n]*\};/.test(sc.textContent)) return toast('파일을 만들지 못했어요');
  sc.textContent = sc.textContent.replace(/const FILE_CONFIG = \{[^\n]*\};/, () => line);
  const blob = new Blob(['<!doctype html>' + root.outerHTML], { type: 'text/html' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('index.html을 내려받았어요 → Netlify Drop에 끌어다 놓아요');
};
A.qrBig = () => { const link = studentLink(); const m = modal(`${mHead('📱 학생 라운지 접속')}<div class="mb" style="align-items:center"><div data-qr="${esc(link)}" data-s="380"></div><b>폰 카메라로 찍어요</b></div>`, { wide: true }); drawQR(m); };
const PINS_STORE_KEY = 'fclounge.pins.' + (CFG.code || 'demo');
function getStoredPins() {
  try { return JSON.parse(localStorage.getItem(PINS_STORE_KEY) || '{}'); } catch (e) { return {}; }
}
function saveStoredPins(obj) {
  try { localStorage.setItem(PINS_STORE_KEY, JSON.stringify(obj)); } catch (e) {}
  try {
    const fcRaw = localStorage.getItem('firstclass.v1');
    if (fcRaw) {
      const fcData = JSON.parse(fcRaw);
      const c = fcData.classes?.find(x => x.id === fcData.activeId) || fcData.classes?.[0];
      if (c) {
        c.lpins = c.lpins || {};
        for (const [id, pin] of Object.entries(obj)) {
          c.lpins[id] = Object.assign(c.lpins[id] || {}, { pin });
        }
        localStorage.setItem('firstclass.v1', JSON.stringify(fcData));
      }
    }
  } catch (e) {}
}
function gen6Pin(s, used) {
  const nn = String((s?.no || 1) % 100).padStart(2, '0');
  const candidates = [nn + nn + nn, '00' + nn + nn, nn + '00' + nn, '10' + nn + nn, '20' + nn + nn];
  for (const c of candidates) { if (!used.has(c)) return c; }
  for (let t = 0; t < 60; t++) {
    const rnd = String(Math.floor(100000 + Math.random() * 900000));
    if (!used.has(rnd)) return rnd;
  }
  return String(Math.floor(100000 + Math.random() * 900000));
}
A.stuPinSave = async d => {
  const sid = d.id;
  const input = document.querySelector(`input[data-spin="${sid}"]`);
  if (!input) return;
  const pin = input.value.trim().replace(/\D/g, '');
  const curH = Object.assign({}, S.main?.pinH || {});
  const local = getStoredPins();
  if (!pin) {
    if (!confirm(`${nm(sid)} 학생의 비밀번호를 삭제할까요?`)) return;
    delete curH[sid];
    delete local[sid];
    await DB.update('app/main', { pinH: curH });
    saveStoredPins(local);
    toast(`${nm(sid)} 비밀번호 삭제됨`);
    return;
  }
  if (pin.length !== 6) return toast('비밀번호는 숫자 6자리여야 해요');
  curH[sid] = pinHash(sid, pin);
  local[sid] = pin;
  await DB.update('app/main', { pinH: curH });
  saveStoredPins(local);
  toast(`${nm(sid)} 비밀번호를 '${pin}'(으)로 저장했어요`);
};
A.stuPinAuto = async () => {
  const r = roster();
  const curH = Object.assign({}, S.main?.pinH || {});
  const local = getStoredPins();
  const used = new Set(Object.values(local));
  let count = 0;
  for (const s of r) {
    if (curH[s.id] && local[s.id]) continue;
    const pin = gen6Pin(s, used);
    used.add(pin);
    local[s.id] = pin;
    curH[s.id] = pinHash(s.id, pin);
    count++;
  }
  if (!count) return toast('이미 모든 학생의 비밀번호가 설정되어 있어요');
  await DB.update('app/main', { pinH: curH });
  saveStoredPins(local);
  toast(`${count}명의 6자리 비밀번호를 생성했어요!`);
};
A.stuPinAll = async () => {
  if (!confirm('모든 학생의 비밀번호를 새로 생성할까요?\n(기존 비밀번호가 변경됩니다)')) return;
  const r = roster();
  const curH = {};
  const local = {};
  const used = new Set();
  for (const s of r) {
    const pin = gen6Pin(s, used);
    used.add(pin);
    local[s.id] = pin;
    curH[s.id] = pinHash(s.id, pin);
  }
  await DB.update('app/main', { pinH: curH });
  saveStoredPins(local);
  toast(`학생 ${r.length}명 전원 새 비밀번호를 생성했어요!`);
};
A.stuPinList = () => {
  const r = roster();
  const local = getStoredPins();
  const H = S.main?.pinH || {};
  const lines = r.map(s => {
    const p = local[s.id] || (S.main?.sample ? '111111' : (H[s.id] ? '(설정됨)' : '(미설정)'));
    return `${s.no}번 ${s.name}: ${p}`;
  });
  const text = lines.join('\n');
  const m = modal(`${mHead('📋 학생 비밀번호 명단')}<div class="mb">
    <p class="small muted" style="margin:0">학생들에게 나누어 주거나 안내할 수 있는 6자리 비밀번호 명단입니다.</p>
    <textarea rows="11" readonly style="font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:8px;border-radius:8px;border:1px solid var(--line);width:100%">${esc(text)}</textarea>
    <div class="row" style="justify-content:flex-end">
      <button class="btn p sm" id="copyPinListBtn">클립보드에 복사</button>
    </div>
  </div>`);
  const btn = $('#copyPinListBtn');
  if (btn) btn.onclick = () => {
    navigator.clipboard.writeText(text).then(() => toast('명단을 클립보드에 복사했어요!')).catch(() => toast('복사에 실패했습니다'));
  };
};
A.tpinSave = async () => { const v = $('#tpin').value.replace(/\D/g, ''); if (v.length !== 4) return toast('숫자 4자리'); await DB.set('app/secret', { tpin: v }); $('#tpin').value = ''; toast('교사 PIN을 바꿨어요'); };
A.ntSave = async () => { await DB.set('app/settings', { notice: $('#ntx').value.trim() }); toast('공지를 저장했어요'); };

/* ---------------- boot ---------------- */
async function boot() {
  try { DB = CFG.fb ? await makeCloud(CFG) : makeLocal(CFG.code); }
  catch (e) { console.error(e); toast('Firestore 연결 실패 — 체험 모드로 열어요'); DB = makeLocal(CFG.code); }
  setConn(DB.kind === 'cloud' ? 'cloud' : 'demo', DB.kind === 'cloud' ? `연결됨 · ${CFG.code}` : '체험 모드');
  const docs = { main: 'app/main', secret: 'app/secret', set: 'app/settings', stock: 'app/stock', mani: 'app/manito', att: 'app/attitude' };
  for (const [k, p] of Object.entries(docs)) DB.watchDoc(p, v => { S[k] = v; render(); });
  DB.watchCol('wallets', l => { S.wallets = Object.fromEntries(l.map(d => [d.id, d])); render(); });
  DB.watchCol('mani', l => { S.manis = Object.fromEntries(l.map(d => [d.id, d])); render(); });
  for (const c of ['contests', 'board', 'polls', 'relay', 'reports']) DB.watchCol(c, l => { S[c] = l; render(); });
  DB.watchCol('wall', l => { S.wall = l; render(); if (U.wallOpen) { if (S.wall.some(w => w.id === U.wallOpen)) wallRefresh(); else closeModal(); } aiWork(); });
  render();
}
boot();
</script>
